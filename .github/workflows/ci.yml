name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # typecheck + lint + test with coverage + build + gzipped size budget
      - run: npm run check

      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: dist/
          retention-days: 7
